name: MLflow DVC CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  compilation:
    name: Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: |
          python -m py_compile train.py
          python -m py_compile test_train.py
          echo "Compilation successful"


  linking:
    name: Linking
    runs-on: ubuntu-latest
    needs: compilation

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint dvc

      - name: Verify dependencies
        run: |
          python -c "import mlflow; print('MLflow linked successfully')"
          python -c "import sklearn; print('Scikit-learn linked successfully')"
          python -c "import dvc; print('DVC linked successfully')"
          pip check

      - name: Linking successful
        run: |
          echo "Linking successful"


  testing:
    name: PyLint + PyUnit Testing
    runs-on: ubuntu-latest
    needs: linking

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint dvc

      - name: Run PyLint
        run: |
          pylint train.py

      - name: Run PyUnit tests
        run: |
          python train.py
          python -m unittest test_train.py -v

      - name: Testing successful
        run: |
          echo "PyLint and PyUnit tests passed successfully"


  artifacts:
    name: Upload MLflow Artifacts
    runs-on: ubuntu-latest
    needs: testing

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training
        run: |
          python train.py

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlflow_artifact.txt
            mlruns/