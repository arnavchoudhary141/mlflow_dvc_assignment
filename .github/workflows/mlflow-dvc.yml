name: MLflow DVC CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================
  # STAGE 1: COMPILATION
  # =========================
  compilation:
    name: Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: |
          python -m py_compile train.py
          echo "Compilation successful"

      - name: Verify DVC
        run: |
          pip install dvc
          dvc --version
          dvc status


  # =========================
  # STAGE 2: LINKING
  # =========================
  linking:
    name: Linking
    runs-on: ubuntu-latest
    needs: compilation

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dependencies
        run: |
          python -c "import mlflow; print('MLflow linked successfully')"
          python -c "import sklearn; print('Scikit-learn linked successfully')"
          python -c "import dvc; print('DVC linked successfully')"

      - name: Check installed packages
        run: |
          pip check
          echo "Linking successful"


  # =========================
  # STAGE 3: TESTING
  # =========================
  testing:
    name: Testing
    runs-on: ubuntu-latest
    needs: linking

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MLflow training test
        run: |
          python train.py

      - name: Verify MLflow artifact
        run: |
          test -f mlflow_artifact.txt
          echo "MLflow artifact test passed"

      - name: Test completed
        run: |
          echo "All tests passed successfully"


  # =========================
  # FINAL ARTIFACT
  # =========================
  artifact:
    name: Upload MLflow Artifacts
    runs-on: ubuntu-latest
    needs: testing

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training
        run: |
          python train.py

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlflow_artifact.txt
            mlruns/
            